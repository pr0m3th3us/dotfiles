        var r=sv("rect",{x:x,y:y,width:Math.max(w-2,1),height:bh2,rx:3,fill:SERIES[j]});
        r.appendChild(sv("title",{},s.name+", "+lab+": "+fmt(v,b)));svg.appendChild(r);
        if(w>44)svg.appendChild(sv("text",{x:x+w/2-1,y:y+bh2/2+4,"text-anchor":"middle","class":"val",style:"fill:#fff;font-weight:600"},fmt(v,b)));
        x+=w;
      });
    });
  } else {errors.push("chart: unknown chart kind '"+kind+"'");return el("div");}
  return fig(L,svg);
}

// ---- block diagram -------------------------------------------------------
function diagram(b){
  var nodes=arr(b.nodes),edges=arr(b.edges),groups=arr(b.groups);
  var cols=1,rows=1;nodes.forEach(function(n){cols=Math.max(cols,(n.col||1));rows=Math.max(rows,(n.row||1));});
  var W=680,colW=W/cols,gpad=groups.length?22:0,rowH=b.row_height||(groups.length?112:96);
  var bw=Math.min(colW-64,200),H=rows*rowH+gpad;
  var svg=svgRoot(W,H,b.title||b.caption);
  var defs=sv("defs");var m=sv("marker",{id:"arr"+(++diagram.n),viewBox:"0 0 10 10",refX:9,refY:5,markerWidth:7,markerHeight:7,orient:"auto-start-reverse"});
  m.appendChild(sv("path",{d:"M0,0 L10,5 L0,10 z",fill:"var(--muted)"}));defs.appendChild(m);svg.appendChild(defs);
  var mid="arr"+diagram.n,pos={};
  nodes.forEach(function(n){
    var lines=wrap(n.label,Math.floor(bw/7.4)).slice(0,3),sub=n.sub?wrap(n.sub,Math.floor(bw/6.4)).slice(0,2):[];
    var h=Math.max(40,lines.length*16+sub.length*14+18);
    var cx=(n.col-0.5)*colW,cy=(n.row-0.5)*rowH+gpad;
    pos[n.id]={x:cx-bw/2,y:cy-h/2,w:bw,h:h,cx:cx,cy:cy,n:n,lines:lines,sub:sub};
  });
  groups.forEach(function(g){
    var ps=arr(g.nodes).map(function(id){return pos[id];}).filter(Boolean);if(!ps.length)return;
    var x1=Math.min.apply(null,ps.map(function(p){return p.x;}))-10,y1=Math.min.apply(null,ps.map(function(p){return p.y;}))-24;
    var x2=Math.max.apply(null,ps.map(function(p){return p.x+p.w;}))+10,y2=Math.max.apply(null,ps.map(function(p){return p.y+p.h;}))+10;
    var gg=sv("g",{"class":tone(g.tone).trim()});
    gg.appendChild(sv("rect",{x:x1,y:y1,width:x2-x1,height:y2-y1,rx:12,"class":"gbox"}));
    gg.appendChild(sv("text",{x:x1+10,y:y1+15,"class":"sm"},g.label));svg.appendChild(gg);
  });
  function clip(p,tx,ty){var dx=tx-p.cx,dy=ty-p.cy;if(!dx&&!dy)return [p.cx,p.cy];
    var sx=dx?(p.w/2)/Math.abs(dx):Infinity,sy=dy?(p.h/2)/Math.abs(dy):Infinity,s=Math.min(sx,sy);return [p.cx+dx*s,p.cy+dy*s];}
  var labelsLayer=[];
  edges.forEach(function(e){
    var a=pos[e.from],c=pos[e.to];if(!a||!c){errors.push("diagram: edge "+e.from+"→"+e.to+" names a missing node");return;}
    var p1=clip(a,c.cx,c.cy),p2=clip(c,a.cx,a.cy);
    var ln=sv("line",{x1:p1[0],y1:p1[1],x2:p2[0],y2:p2[1],"class":"edge"+(e.dashed?" dash":""),"marker-end":"url(#"+mid+")"});
    if(e.both)ln.setAttribute("marker-start","url(#"+mid+")");
    svg.appendChild(ln);
    if(e.label){var mx=(p1[0]+p2[0])/2,my=(p1[1]+p2[1])/2,horiz=Math.abs(p2[0]-p1[0])>=Math.abs(p2[1]-p1[1]);
      labelsLayer.push(horiz?sv("text",{x:mx,y:my-7,"text-anchor":"middle","class":"sm"},e.label)
                            :sv("text",{x:mx+7,y:my+4,"text-anchor":"start","class":"sm"},e.label));}
  });
  nodes.forEach(function(n){var p=pos[n.id];
    var g=sv("g",{"class":tone(n.tone).trim()});
    g.appendChild(sv("rect",{x:p.x,y:p.y,width:p.w,height:p.h,rx:9,"class":"nbox"+(n.filled?" filled":"")}));
    var ty=p.cy-((p.lines.length*16+p.sub.length*14)/2)+12;
    p.lines.forEach(function(l){g.appendChild(sv("text",{x:p.cx,y:ty,"text-anchor":"middle","font-weight":600},l));ty+=16;});
    p.sub.forEach(function(l){g.appendChild(sv("text",{x:p.cx,y:ty,"text-anchor":"middle","class":"sm"},l));ty+=14;});
    svg.appendChild(g);});
  labelsLayer.forEach(function(x){svg.appendChild(x);});
  return fig(b,svg);
}
diagram.n=0;

function treeNode(n){
  var li=el("li");
  li.appendChild(el("span","k"+(n.mono?" mono":""),md(n.label)));
  if(n.note)li.appendChild(el("span","d",' · '+md(n.note)));
  var kids=arr(n.children);
  if(kids.length){var ul=el("ul");kids.forEach(function(k){ul.appendChild(treeNode(k));});li.appendChild(ul);}
  return li;
}

// ---- blocks --------------------------------------------------------------
var R={
  text:function(b){var d=el("div","prose");arr(b.text).forEach(function(p){d.appendChild(el("p",null,md(p)));});return d;},
  list:function(b){var l=el(b.ordered?"ol":"ul","list");arr(b.items).forEach(function(i){l.appendChild(el("li",null,md(i)));});return l;},
  callout:function(b){var d=el("div","callout"+tone(b.tone||({warn:"warn",good:"good",example:"amber"})[b.kind]));
    if(b.title)d.appendChild(el("b","h",md(b.title)+exBadge(b)));arr(b.text).forEach(function(p){d.appendChild(el("p",null,md(p)));});return d;},
  cards:function(b){var d=el("div","cards");if(b.columns)d.style.gridTemplateColumns="repeat("+b.columns+",minmax(0,1fr))";
    arr(b.items).forEach(function(c){var x=el("div","card"+tone(c.tone));if(c.tag)x.appendChild(el("span","tag",esc(c.tag)));
      if(c.title)x.appendChild(el("h3",null,md(c.title)));arr(c.text).forEach(function(p){x.appendChild(el("p",null,md(p)));});d.appendChild(x);});return d;},
  stats:function(b){var d=el("div","stats");arr(b.items).forEach(function(s){var x=el("div","stat"+tone(s.tone));
      x.appendChild(el("span","v",esc(s.value)+(s.example?'<span class="ex">EXAMPLE</span>':"")));x.appendChild(el("span","l",md(s.label)));
      if(s.note)x.appendChild(el("span","nt",md(s.note)));d.appendChild(x);});return d;},
  flow:function(b){var d=el("div","flow"+(b.direction==="column"?" col":""));var st=arr(b.steps);
    var k=st.length<=5?st.length:Math.ceil(st.length/Math.ceil(st.length/5));
    if(b.direction!=="column")d.style.gridTemplateColumns="repeat("+k+",minmax(0,1fr))";
    st.forEach(function(s,i){var x=el("div","step"+(s.mark?" "+s.mark:"")+((i+1)%k===0?" eol":""));
      x.appendChild(el("b",null,md(s.title)));if(s.who)x.appendChild(el("span","who",md(s.who)));if(s.text)x.appendChild(el("span","what",md(s.text)));
      d.appendChild(x);});return d;},
  table:function(b){var w=el("div","tablewrap"),t=el("table"),num=arr(b.numeric);
    var hr=el("tr");arr(b.columns).forEach(function(c,i){hr.appendChild(el("th",num.indexOf(i)>=0?"num":null,md(c)));});
    var th=el("thead");th.appendChild(hr);t.appendChild(th);var tb=el("tbody");
    arr(b.rows).forEach(function(r){var tr=el("tr");arr(r).forEach(function(c,i){
      tr.appendChild(el("td",num.indexOf(i)>=0?"num":(i===0&&b.key_column!==false?"key":null),md(c)));});tb.appendChild(tr);});
    t.appendChild(tb);w.appendChild(t);
    if(!b.title&&!b.caption&&!b.example)return w;
    var f=el("div");if(b.title||b.example)f.appendChild(el("h3",null,md(b.title||"")+exBadge(b)));f.appendChild(w);
    if(b.caption)f.appendChild(el("div","caption",md(b.caption)));return f;},
  chart:chart,
  diagram:diagram,
  svg:function(b){var holder=el("div");holder.innerHTML=String(b.svg||"");var s=holder.querySelector("svg");
    if(!s){errors.push("svg block holds no <svg> element");return el("div");}
    s.setAttribute("role","img");if(b.alt)s.setAttribute("aria-label",b.alt);
    s.querySelectorAll("script,foreignObject").forEach(function(x){x.remove();});return fig(b,s);},
  tree:function(b){var d=el("div","tree panel"),ul=el("ul");arr(b.root).forEach(function(n){ul.appendChild(treeNode(n));});d.appendChild(ul);return d;},
  timeline:function(b){var l=el("ul","timeline");arr(b.items).forEach(function(i){var li=el("li",tone(i.tone).trim());
      li.appendChild(el("div","when",esc(i.when)));li.appendChild(el("div",null,"<b>"+md(i.title)+"</b>"));
      if(i.text)li.appendChild(el("div","what",md(i.text)));l.appendChild(li);});return l;},
  compare:function(b){var d=el("div","compare");arr(b.options).forEach(function(o){var x=el("div","opt"+(o.pick?" pick":""));
      if(o.pick)x.appendChild(el("span","pickt","RECOMMENDED"));x.appendChild(el("h3",null,md(o.name)));
      if(o.text)x.appendChild(el("p",null,md(o.text)));
      var ul=el("ul");arr(o.pros).forEach(function(p){ul.appendChild(el("li","pro",md(p)));});arr(o.cons).forEach(function(p){ul.appendChild(el("li","con",md(p)));});
      if(ul.children.length)x.appendChild(ul);if(o.verdict)x.appendChild(el("p","verdict",md(o.verdict)));d.appendChild(x);});return d;},
  glossary:function(b){var d=el("dl","gloss panel");arr(b.items).forEach(function(i){d.appendChild(el("dt",null,md(i.term)));d.appendChild(el("dd",null,md(i.meaning)));});return d;},
  split:function(b){var d=el("div","split");[b.left,b.right].forEach(function(side){var c=el("div");arr(side).forEach(function(x){c.appendChild(block(x));});d.appendChild(c);});return d;}
};
function block(b){
  var f=R[b&&b.type];
  if(!f){errors.push("unknown block type '"+(b&&b.type)+"'");return el("div");}
  try{var n=f(b);n.classList.add("block");
    if(b.source){var w=el("div","block");n.classList.remove("block");w.appendChild(n);w.appendChild(el("div","caption","Source: "+md(b.source)));return w;}
    return n;}
  catch(e){errors.push(b.type+" block failed: "+e.message);return el("div");}
}

function render(){
  if(!data)return;
  if(data.theme&&data.theme.accent)document.documentElement.style.setProperty("--accent",data.theme.accent);
  var h=el("header");
  if(data.kicker)h.appendChild(el("span","kicker",esc(data.kicker)));
  h.appendChild(el("h1",null,md(data.title)));
  if(data.status)h.appendChild(el("span","status",esc(data.status)));
  arr(data.lede).forEach(function(p){h.appendChild(el("p","lede",md(p)));});
  root.appendChild(h);
  arr(data.sections).forEach(function(s,i){
    var sec=el("section",s.break_before?"pb":null);if(s.id)sec.id=s.id;
    sec.appendChild(el("h2",null,(data.number_sections===false?"":'<span class="n">'+(i+1)+"</span>")+md(s.title)));
    if(s.takeaway)sec.appendChild(el("p","takeaway",md(s.takeaway)));
    arr(s.blocks).forEach(function(b){sec.appendChild(block(b));});
    root.appendChild(sec);
  });
  var f=el("footer");
  if(arr(data.sources).length){f.appendChild(el("b",null,"What this page draws on"));var src=el("div","sources");
    arr(data.sources).forEach(function(s){src.appendChild(el("span",null,"<code>"+esc(s)+"</code>"));});f.appendChild(src);}
  var meta=[];if(data.updated)meta.push("Updated "+esc(data.updated)+(data.updated_by?" by "+esc(data.updated_by):""));
  if(data.footer)meta.push(md(data.footer));
  if(meta.length)f.appendChild(el("p",null,meta.join(" · ")));
  root.appendChild(f);
}
try{render();}catch(e){errors.push("render failed: "+e.message);}
if(errors.length){var eb=document.getElementById("vis-errors");eb.style.display="block";eb.textContent="Render errors:\n"+errors.join("\n");}
document.documentElement.setAttribute("data-rendered","1");
})();
</script>
