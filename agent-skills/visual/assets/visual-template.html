.stat .v{font-family:var(--display);font-size:clamp(40px,5vw,84px);font-weight:700;line-height:1.16;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat .l{font-weight:600}
.stat .nt{font-size:.88em;color:var(--sub);line-height:1.3}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:14px 26px;counter-reset:st}
.step{position:relative;background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0;counter-increment:st}
.step b{font-family:var(--display);line-height:1.15}
.step b::before{content:counter(st) ".  ";color:var(--tone-on)}
.flow:not(.col) .step:not(:last-child):not(.eol)::after{content:"→";position:absolute;right:-21px;top:50%;transform:translateY(-50%);color:var(--tone-on);font-weight:700}
.step .who{font-size:.84em;color:var(--tone-on);font-weight:600}
.step .what{font-size:.9em;color:var(--sub);line-height:1.3}
.step.gate{border:2px solid var(--amber)}.step.done{border:2px solid var(--good)}.step.stop{border:2px solid var(--warn)}
.flow.col{grid-template-columns:1fr;gap:10px}
.tablewrap{overflow-x:auto;border-top:3px solid var(--fg)}
table{border-collapse:collapse;width:100%;font-size:.9em}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--rule)}
th{font-size:.78em;letter-spacing:.07em;text-transform:uppercase;color:var(--sub);font-weight:600}
td.key{font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tree ul{list-style:none;margin:0;padding-left:22px;border-left:1px dashed var(--rule)}
.tree>ul{border-left:0;padding-left:0}
.tree li{padding:4px 0 4px 4px}
.tree .k{font-weight:600}.tree .k.mono{font-family:ui-monospace,monospace;font-size:.86em}
.tree .d{color:var(--sub);font-size:.92em}
.timeline{list-style:none;margin:0 0 0 7px;padding:0;border-left:3px solid var(--rule);display:flex;flex-direction:column;gap:16px}
.timeline li{position:relative;padding-left:22px}
.timeline li::before{content:"";position:absolute;left:-10px;top:5px;width:17px;height:17px;border-radius:50%;background:var(--tone,var(--tone-on));border:3px solid var(--bg-solid,#fff)}
.timeline .when{font-size:.8em;font-weight:600;letter-spacing:.05em;color:var(--tone-on)}
.timeline .what{color:var(--sub);font-size:.94em}
dl.gloss{margin:0;display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:8px 18px}
dl.gloss dt{font-weight:600}dl.gloss dd{margin:0;color:var(--sub)}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:clamp(16px,2vw,32px);align-items:start}
.split>div{display:flex;flex-direction:column;gap:14px;min-width:0}
.factfile{background:var(--tone-on);color:#fff;border-radius:var(--radius);padding:clamp(16px,1.6vw,26px);display:flex;flex-direction:column;gap:8px}
.scene-night .factfile,.scene-sky .factfile{color:#10123a}
.scene-accent .factfile{color:var(--accent-d)}
.factfile h3{font-size:1.1em}
.factfile ul{margin:0;padding:0;list-style:none;font-size:.94em;display:grid;gap:6px clamp(16px,2vw,32px);grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr))}
blockquote.quote{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(24px,2.6vw,44px);line-height:1.12;max-width:26em}
blockquote.quote cite{display:block;margin-top:8px;font:400 max(.5em,14px)/1.3 var(--body);color:var(--sub)}
/* ---- cover -------------------------------------------------------------- */
.cover{min-height:100svh;display:flex}
.cover .page{justify-content:center;min-height:100svh;padding-top:clamp(40px,5vw,72px);padding-bottom:clamp(36px,4vw,64px);gap:clamp(18px,2.4vw,36px)}
.c-grid{display:grid;grid-template-columns:minmax(min-content,5fr) minmax(0,7fr);gap:clamp(20px,3vw,56px);align-items:center;flex:1}
.c-text{display:flex;flex-direction:column;gap:clamp(12px,1.4vw,22px);min-width:0}
.c-kicker{font-weight:600;font-size:.84em;letter-spacing:.1em;text-transform:uppercase;color:var(--tone-on)}
h1.title{font-size:clamp(50px,7.4vw,136px);line-height:.98;letter-spacing:-.025em}
.c-deck{font-size:clamp(20px,1.7vw,29px);line-height:1.25;color:var(--sub);max-width:28em}
.status{align-self:flex-start;font-size:.78em;font-weight:600;letter-spacing:.04em;border:1.5px solid currentColor;border-radius:99px;padding:2px 12px;color:var(--tone-on)}
.c-art{min-width:0}
.c-art .a-stage svg{overflow:visible}
.annot[data-mode="pins"] .m3-box text{display:none}

.t30 .lb{grid-column:1/-1;font-weight:600;font-size:.76em;letter-spacing:.1em;text-transform:uppercase;color:var(--tone-on)}
.t30 p{font-size:clamp(17px,1.25vw,22px);line-height:1.22;font-weight:600}
.scrollcue{position:absolute;left:50%;bottom:10px;z-index:2;width:2px;height:34px;background:linear-gradient(var(--fg),transparent);transform-origin:top;animation:vcue 2s ease-in-out infinite}
@keyframes vcue{0%{transform:scaleY(0)}50%{transform:scaleY(1)}100%{transform:scaleY(0) translateY(34px)}}
.cover.over .c-grid{grid-template-columns:minmax(0,1fr)}
.cover.over .c-art{position:absolute;inset:0;z-index:0}
.cover.over .c-art .art,.cover.over .c-art .a-stage{height:100%}
.cover.over .c-art svg{position:absolute;inset:0;width:100%;height:100%}
.cover.over .c-text{max-width:min(46rem,100%);position:relative;z-index:1}
.cover.over .c-art::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bg-solid) 8%,color-mix(in srgb,var(--bg-solid) 72%,transparent) 42%,transparent 72%)}
@media (max-width:1040px){.cover.over .c-art::after{background:linear-gradient(180deg,var(--bg-solid) 20%,color-mix(in srgb,var(--bg-solid) 72%,transparent) 55%,transparent 85%)}}
/* ---- background effects: gradients and vectors only, so they print sharp --- */
.fx{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.fx svg{position:absolute;inset:0;width:100%;height:100%}
.fx-aurora::before{content:"";position:absolute;inset:-20%;background:
  radial-gradient(38% 42% at 22% 28%,color-mix(in srgb,var(--accent) 52%,transparent),transparent 72%),
  radial-gradient(34% 40% at 78% 20%,color-mix(in srgb,var(--violet) 52%,transparent),transparent 72%),
  radial-gradient(42% 46% at 62% 86%,color-mix(in srgb,var(--sky) 42%,transparent),transparent 72%);animation:vdrift 22s ease-in-out infinite alternate}
@keyframes vdrift{to{transform:translate3d(5%,-4%,0) scale(1.1)}}
.fx-dots{background-image:radial-gradient(color-mix(in srgb,var(--fg) 20%,transparent) 1.4px,transparent 1.8px);background-size:20px 20px;-webkit-mask-image:linear-gradient(120deg,#000,transparent 62%);mask-image:linear-gradient(120deg,#000,transparent 62%)}
.fx-grid::before{content:"";position:absolute;left:-50%;right:-50%;bottom:-8%;height:62%;
  background-image:linear-gradient(color-mix(in srgb,var(--accent) 55%,transparent) 1.5px,transparent 1.5px),linear-gradient(90deg,color-mix(in srgb,var(--accent) 55%,transparent) 1.5px,transparent 1.5px);
  background-size:64px 64px;transform:perspective(620px) rotateX(64deg);transform-origin:50% 100%;animation:vgrid 3.4s linear infinite;-webkit-mask-image:linear-gradient(transparent,#000 75%);mask-image:linear-gradient(transparent,#000 75%)}
@keyframes vgrid{to{background-position:0 64px}}
.fx-rays::before{content:"";position:absolute;left:50%;top:50%;width:190vmax;height:190vmax;margin:-95vmax 0 0 -95vmax;background:repeating-conic-gradient(color-mix(in srgb,var(--fg) 7%,transparent) 0 8deg,transparent 8deg 22deg);animation:vspin 90s linear infinite}
.fx .tw{animation:vtwinkle 3.4s ease-in-out infinite}
/* ---- furniture ----------------------------------------------------------- */
.progress{position:fixed;left:0;top:0;height:4px;width:100%;transform-origin:left;transform:scaleX(0);background:var(--accent);z-index:40}
.nav{position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:40;display:flex;flex-direction:column;gap:9px;mix-blend-mode:difference}
.nav a{display:block;width:9px;height:9px;border-radius:50%;background:#fff;opacity:.45;transition:transform .2s,opacity .2s}
.nav a.on{opacity:1;transform:scale(1.5)}
.printbtn{align-self:flex-start;font:600 15px var(--body);padding:8px 16px;border-radius:99px;border:1.5px solid currentColor;background:transparent;color:var(--fg);cursor:pointer}
.freeze .progress,.freeze .nav,.freeze .scrollcue{display:none}
.folio{display:none}
.colophon .page{gap:18px;padding-top:clamp(40px,5vw,72px);padding-bottom:clamp(40px,5vw,72px)}
.colophon h2{font-size:clamp(24px,2.4vw,36px)}
.srcs{display:grid;gap:10px 28px;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));font-size:.9em}
.srcs .s b{display:block}
.srcs .s code{font-size:.82em}
.srcs .s span{color:var(--sub);display:block;line-height:1.3}
.key{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.84em;color:var(--sub);align-items:center}
.meta{font-size:.84em;color:var(--sub)}
/* motion */
.js-motion .reveal{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.js-motion .reveal.in{opacity:1;transform:none}
.freeze *,.freeze *::before,.freeze *::after{animation:none!important;transition:none!important}
.freeze .reveal{opacity:1!important;transform:none!important}
.freeze [data-step].off,.flat [data-step].off{opacity:1}
.freeze .scrolly,.flat .scrolly{display:flex;flex-direction:column;gap:16px}
.freeze .sc-art,.flat .sc-art{position:static;height:auto}
.freeze .sc-art svg,.flat .sc-art svg{max-height:none}
.freeze .sc-steps,.flat .sc-steps{padding:0;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr))}
.freeze .sc-step,.flat .sc-step{min-height:0;align-items:stretch}
.freeze .sc-step>div,.flat .sc-step>div{opacity:1;width:100%}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
/* ---- tablet and phone ---------------------------------------------------- */
@media (max-width:1040px){
  .c-grid{grid-template-columns:minmax(0,1fr)}
  .cover .page{justify-content:flex-start}
  .feature,.feature.flip{grid-template-columns:minmax(0,1fr)}
  .feature.flip .f-text{order:0}
  .nav{display:none}
}
@media (max-width:760px){
  .page{padding:48px 18px}
  .duel{grid-template-columns:minmax(0,1fr)}
  .duel .vs{justify-self:center}
  .panels{grid-template-columns:minmax(0,1fr);--n:1!important}
  .panels .panel-item>.art::after{display:none!important}
  .t30{grid-template-columns:minmax(0,1fr)}
  .flat .sc-steps{grid-template-columns:minmax(0,1fr)}
  .flow:not(.col){grid-template-columns:minmax(0,1fr)!important}
  .flow .step::after{display:none}
  dl.gloss{grid-template-columns:1fr}
  .a-stage.pan svg{min-width:var(--pan-w,860px)}
  .printbtn{display:none}
  .stage{min-height:0;display:block}
  .stage>.st-art{position:relative;aspect-ratio:4/3}
  .st-card{max-width:none}
}
/* ---- print: one spread, one full-bleed A4 page ---------------------------- */
@page{size:A4;margin:0}

  .spread:first-of-type{break-before:auto}
  .spread.flowing{break-inside:auto;overflow:visible;display:block}
  .spread.flowing .page{-webkit-box-decoration-break:clone;box-decoration-break:clone;display:block}
  .spread.flowing .page>*{margin-bottom:5mm}
  .spread.flowing .card,.spread.flowing .opt,.spread.flowing .step,.spread.flowing .stat,.spread.flowing figure.art,.spread.flowing tr,.spread.flowing .callout,.spread.flowing .timeline li{break-inside:avoid}
  .page{max-width:none;flex:1;padding:14mm 14mm 15mm;gap:5.5mm;justify-content:flex-start}
  .head{gap:2mm;max-width:none}
  h2.headline{font-size:27pt;line-height:1.05}
  .question{font-size:12.5pt}.chap{font-size:9.5pt}
  .deck{font-size:12pt;max-width:none;gap:2mm}
  .punch{font-size:14pt;max-width:none;margin-top:auto}
  .feature,.feature.flip{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr;gap:5mm;flex:1}
  .feature>.reveal:has(figure){display:flex;flex-direction:column;justify-content:center}
  .feature.flip .f-text{order:0}
  .panels{gap:5mm;grid-template-columns:minmax(0,1fr)!important;flex:1;align-content:space-evenly}
  .panel-item{display:grid;grid-template-columns:52% 1fr;grid-template-rows:auto auto;column-gap:7mm;row-gap:2mm;align-content:center}
  .panel-item>.art{grid-row:1/span 2}.panel-item>h3{align-self:end;font-size:15pt}.panel-item>p{align-self:start;font-size:11.5pt;line-height:1.3}
  .panels:not(.no-arrows) .panel-item:not(:last-child)>.art::after{content:"↓";right:auto;left:50%;top:auto;bottom:-4mm;font-size:18pt}
  .cards.fixed{grid-template-columns:repeat(var(--cols),minmax(0,1fr))!important}
  .page>.reveal:has(figure){flex:1;display:flex;flex-direction:column;justify-content:center}
  .badge{font-size:8pt}
  .fx svg{opacity:.5}
  .flat .sc-steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sc-step h3{font-size:12.5pt}.sc-step p{font-size:11pt;line-height:1.28}.sc-step>div{padding:3mm 3.4mm}
  .duel{gap:3mm}.duel .side h3{font-size:14pt}.duel .vs{font-size:14pt}
  .caption{font-size:10pt}
  .note{font-size:10pt;line-height:1.24}.note b{font-size:10.8pt}
  .a-stage svg{font-size:14px}
  .stat .v{font-size:32pt}.stat .nt{font-size:10pt}
  .card,.opt,.step{padding:3mm 3.4mm}.card p,.opt p,.opt ul,.step .what{font-size:10.5pt;line-height:1.26}
  .card h3,.opt h3{font-size:12.5pt}
  table{font-size:10pt}
  .cover{min-height:296.7mm}
  .cover .page{min-height:0;justify-content:flex-start;padding:16mm 14mm 13mm;gap:5mm}
  .c-grid{display:flex;flex-direction:column;gap:6mm;align-items:stretch;flex:1}
  .c-art{flex:1;display:flex;align-items:center}
  .c-art .art{width:100%}
  h1.title{font-size:50pt}.c-deck{font-size:15pt}
  .t30 p{font-size:12pt}.t30{grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:5mm}
  .stage{display:flex;flex-direction:column}
  .stage>.st-art{position:relative;inset:auto;height:190mm;order:2}
  .stage .page{order:1;flex:none;padding-bottom:6mm}
  .st-card{max-width:none}
  .st-art figcaption{left:14mm;top:6mm}
  .colophon .page{gap:4mm}.srcs{font-size:10pt}
  .folio{display:flex;position:absolute;left:14mm;right:14mm;bottom:6.5mm;z-index:2;justify-content:space-between;font-size:8.5pt;color:var(--sub)}
  a{text-decoration:none}
  .a-stage.pan{overflow:visible}
  .a-stage.pan svg{min-width:0}
}

    ps.forEach(function(p){var c=el("div","panel-item");add(c,artOf(p.art));if(p.title)c.appendChild(el("h3",null,md(p.title)));if(p.text)c.appendChild(el("p",null,md(p.text)));d.appendChild(c);});
    page.appendChild(d);add(page,supportOf(s));add(page,punchOf(s));
  },

    var d=el("div","scrolly"),a=el("div","sc-art"),st=el("div","sc-steps");add(a,artOf(s.art));
    arr(s.steps).forEach(function(x,i){var c=el("div","sc-step"),b=el("div");if(x.title)b.appendChild(el("h3",null,md(x.title)));if(x.text)b.appendChild(el("p",null,md(x.text)));c.appendChild(b);c.__i=i+1;c.__x=x;st.appendChild(c);});

};
var scrollies=[];
function spread(s,i,total){
  var layout=s.layout||"flow",sec;
  spreadNo=i+1;
  if(layout==="stage"){
    sec=shell(s,"stage layout-stage");
    var st=el("div","st-art");add(st,artOf(s.art));sec.appendChild(st);
    var bleed=st.querySelector("svg");if(bleed)bleed.setAttribute("preserveAspectRatio","xMidYMid slice");
    var pg=el("div","page"),card=el("div","st-card reveal"+(s.flip?" right":""));
    add(card,headOf(s,data.number_sections===false?null:i+1));add(card,deckOf(s));add(card,punchOf(s));pg.appendChild(card);add(pg,supportOf(s));sec.appendChild(pg);
  } else {
    sec=shell(s,"layout-"+layout+(s.flowing?" flowing":""));
    var page=el("div","page");
    (LAYOUT[layout]||(errors.push("unknown layout '"+layout+"'"),LAYOUT.flow))(s,data.number_sections===false?null:i+1,page);
    sec.appendChild(page);
  }
  sec.setAttribute("data-spread",i+1);if(s.appendix)sec.setAttribute("data-appendix","1");
  var fo=el("div","folio","<span>"+esc(String(data.title).replace(/[*`_]/g,""))+"</span><span>"+(i+2)+"</span>");fo.setAttribute("data-furniture","1");sec.appendChild(fo);
  return sec;

function cover(){
  var c=data.cover||{},sec=shell({scene:c.scene||"sky",fx:c.fx||"none",id:"top"},"cover"+(c.over?" over":""));
  sec.setAttribute("data-spread","0");spreadNo=0;
  var pg=el("div","page"),grid=el("div","c-grid"),t=el("div","c-text reveal");
  if(data.kicker)t.appendChild(el("span","c-kicker",esc(data.kicker)));
  t.appendChild(el("h1","title",md(data.title)));
  arr(data.deck||data.lede).forEach(function(p){t.appendChild(el("p","c-deck",md(p)));});
  if(data.status)t.appendChild(el("span","status",esc(data.status)));
  grid.appendChild(t);

function sourceOf(s){
  if(typeof s==="string")return {title:s.split("/").pop().split("#")[0],path:s};
  return s||{};
}
function colophon(){
  var srcs=arr(data.sources);

  var pg=el("div","page");

  if(lim.length){pg.appendChild(el("h2",null,"What we did not check"));var lu=el("ul","list");lim.forEach(function(x){lu.appendChild(el("li",null,md(x)));});pg.appendChild(lu);}

      d.appendChild(el("b",null,s.url?'<a href="'+esc(s.url)+'">'+md(s.title||s.url)+"</a>":md(s.title||s.path||"")));
      if(s.path)d.appendChild(el("code",null,esc(s.path)));
      if(s.note)d.appendChild(el("span",null,md(s.note)));
      g.appendChild(d);});pg.appendChild(g);}
  var used={};JSON.stringify(data,function(k,v){if((k==="status")&&BADGE[v])used[v]=1;return v;});
  var keys={observed:"seen in the source",reported:"someone else says so",inferred:"our reading of it",illustrative:"drawn to explain, not real output",unknown:"not established",example:"made-up numbers for teaching"};
  var ku=Object.keys(used);

  var meta=[];if(data.updated)meta.push("Updated "+esc(data.updated)+(data.updated_by?" by "+esc(data.updated_by):""));
  if(data.footer)meta.push(md(data.footer));
  if(meta.length)pg.appendChild(el("p","meta",meta.join(" · ")));
  var pb=el("button","printbtn","Print or save as A4 PDF");pb.setAttribute("data-furniture","1");pb.type="button";pb.onclick=function(){window.print();};pg.appendChild(pb);

function render(){
  if(!data)return;
  var th=data.theme||{};
  H.setAttribute("data-preset",th.preset||"atlas");
  if(th.accent)H.style.setProperty("--accent",th.accent);
  root.appendChild(cover());
  var list=arr(data.spreads).length?arr(data.spreads):arr(data.sections);
  list.forEach(function(s,i){root.appendChild(spread(s,i,list.length));});
  root.appendChild(colophon());
  var bar=el("div","progress");bar.setAttribute("data-furniture","1");document.body.appendChild(bar);
  var nav=el("nav","nav");nav.setAttribute("aria-label","Chapters");nav.setAttribute("data-furniture","1");
  root.querySelectorAll(".spread[data-spread]").forEach(function(s){if(s.getAttribute("data-spread")==="end")return;if(!s.id)s.id="s"+s.getAttribute("data-spread");var a=el("a");a.href="#"+s.id;a.title=(s.querySelector("h1,h2")||{}).textContent||"";a.setAttribute("aria-label",a.title);nav.appendChild(a);});
  document.body.appendChild(nav);

  document.addEventListener("pointermove",function(e){var t=e.target&&e.target.closest&&e.target.closest("[data-tip]");
    if(t){tp.textContent=t.getAttribute("data-tip");tp.style.opacity=1;tp.style.left=Math.min(innerWidth-290,e.clientX+14)+"px";tp.style.top=(e.clientY+14)+"px";}else tp.style.opacity=0;});
}
// ---- motion -------------------------------------------------------------------
function initScrollies(){
  scrollies.forEach(function(d){
    var steps=d.querySelectorAll(".sc-step"),art=d.querySelector(".sc-art"),svg=art.querySelector("svg");
    function setStep(n){
      steps.forEach(function(x){x.classList.toggle("on",x.__i===n);});
      if(!svg)return;
      svg.querySelectorAll("[data-step]").forEach(function(e){e.classList.toggle("off",Number(e.getAttribute("data-step"))>n);});
      if(svg.__m3){var x=steps[n-1]&&steps[n-1].__x;if(x&&x.explode!=null){svg.__m3.target=x.explode;}}
      art.__step=n;
    }
    d.__set=setStep;setStep(1);
    if(!("IntersectionObserver" in window))return;
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)setStep(e.target.__i);});},{rootMargin:"-46% 0px -46% 0px"});
    steps.forEach(function(x){io.observe(x);});
  });
}
function initMotion(){
  initScrollies();
  if(!motionOK)return;
  H.classList.add("js-motion");
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}});},{rootMargin:"0px 0px -8% 0px"});
  document.querySelectorAll(".reveal").forEach(function(x){io.observe(x);});
  var bar=document.querySelector(".progress"),dots=document.querySelectorAll(".nav a");
  var spreads=[].slice.call(document.querySelectorAll(".spread[data-spread]"));
  var depth=[].slice.call(document.querySelectorAll("[data-depth]"));
  var px=0,py=0;
  document.addEventListener("pointermove",function(e){px=e.clientX/innerWidth-.5;py=e.clientY/innerHeight-.5;},{passive:true});
  var frozen=function(){return H.classList.contains("freeze")||H.classList.contains("printing");};
  function frame(t){
    if(!frozen()){
      var sy=window.scrollY,vh=innerHeight,max=Math.max(1,document.documentElement.scrollHeight-vh);
      if(bar)bar.style.transform="scaleX("+(sy/max)+")";
      spreads.forEach(function(s,i){var r=s.getBoundingClientRect();if(dots[i])dots[i].classList.toggle("on",r.top<vh*.5&&r.bottom>vh*.5);});
      depth.forEach(function(g){var d=parseFloat(g.getAttribute("data-depth"))||0,r=(g.ownerSVGElement||g).getBoundingClientRect();
        if(r.bottom<-200||r.top>vh+200)return;
        var offs=(r.top+r.height/2-vh/2);g.style.transform="translate3d("+(-px*40*d).toFixed(1)+"px,"+(offs*.12*d-py*24*d).toFixed(1)+"px,0)";});
      models.forEach(function(svg){var m=svg.__m3,r=svg.getBoundingClientRect();if(r.bottom<-100||r.top>vh+100)return;
        var near=1-Math.min(1,Math.abs((r.top+r.height/2-vh/2)/vh));
        var want=m.target!=null?m.target:Math.max(.12,Math.min(1,near*1.4));
        m.state.ex+=(want-m.state.ex)*.08;
        m.state.dy+=((px*20+Math.sin(t/2600)*4)-m.state.dy)*.06;
        m.state.dp+=((-py*6)-m.state.dp)*.06;
        m.draw();
        var an=svg.closest(".annot");if(an&&an.dataset.mode!=="pins")drawLeaders(an);else if(an)drawLeaders(an);
      });
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
// ---- freeze and print: every step shown, every model fully exploded, art fitted --
function settle(){
  models.forEach(function(svg){var m=svg.__m3;m.state.ex=1;m.state.dy=0;m.state.dp=0;m.target=null;m.draw();});
  document.querySelectorAll("[data-depth]").forEach(function(g){g.style.transform="";});
  document.querySelectorAll("[data-step].off").forEach(function(e){e.classList.remove("off");});
  document.querySelectorAll(".sc-step").forEach(function(e){e.classList.add("on");});
  document.querySelectorAll(".reveal").forEach(function(e){e.classList.add("in");});
}
function fitPrint(){
  // shrink focal art until each main spread fits its A4 page (text is never shrunk)
  var pageH=296.7*96/25.4;
  document.querySelectorAll(".spread[data-spread]:not([data-appendix])").forEach(function(s){
    var figs=[].slice.call(s.querySelectorAll("figure.art .a-stage svg"));
    figs.forEach(function(g){g.style.maxHeight="";g.style.width="";g.style.margin="";});
    for(var t=0;t<14&&s.scrollHeight>pageH+1&&figs.length;t++){
      var over=s.scrollHeight-pageH,big=figs.reduce(function(m,n){return n.getBoundingClientRect().height>m.getBoundingClientRect().height?n:m;},figs[0]);
      var h=big.getBoundingClientRect().height,nh=Math.max(h*.55,h-over-4),r=nh/h,w=big.getBoundingClientRect().width;
      big.style.width=(w*r)+"px";big.style.margin="0 auto";
    }
  });
}
window.__visPrepare=function(mode){
  if(mode==="print"){H.classList.add("printing","freeze","flat");settle();layoutAll();fitPrint();layoutAll();}
  else if(mode==="freeze"){H.classList.remove("printing","flat");H.classList.add("freeze");settle();layoutAll();}
  else{H.classList.remove("printing","freeze","flat");layoutAll();}
};
window.addEventListener("beforeprint",function(){window.__visPrepare("print");});
window.addEventListener("afterprint",function(){window.__visPrepare("live");});
var rs;window.addEventListener("resize",function(){clearTimeout(rs);rs=setTimeout(layoutAll,120);});
try{render();}catch(e){errors.push("render failed: "+e.message+" "+(e.stack||""));}
if(errors.length){var eb=document.getElementById("vis-errors");eb.style.display="block";eb.textContent="Render errors:\n"+errors.join("\n");}
function boot(){try{layoutAll();initMotion();}catch(e){errors.push("motion failed: "+e.message);}
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(layoutAll);
  H.setAttribute("data-rendered","1");}
boot();
})();
